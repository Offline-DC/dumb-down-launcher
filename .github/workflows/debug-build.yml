name: Debug Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout launcher
        uses: actions/checkout@v4
        with:
          path: dumb-down-launcher

      - name: Checkout dpad-messenger (matrix-app)
        uses: actions/checkout@v4
        with:
          repository: Offline-DC/matrix-app
          ref: main
          path: matrix-app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        working-directory: dumb-down-launcher
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: dumb-down-launcher/app/build/outputs/apk/debug/app-debug.apk
